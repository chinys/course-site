<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.05" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)" rx="0"/>
  
  <!-- Decorative circles -->
  <circle cx="500" cy="80" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="100" cy="350" r="80" fill="#ffffff" opacity="0.05"/>
  <circle cx="550" cy="350" r="60" fill="#ffffff" opacity="0.03"/>
  
  <!-- Balance Scale Icon -->
  <g transform="translate(300, 110)" filter="url(#shadow)">
    <!-- Center pole -->
    <rect x="-3" y="-30" width="6" height="60" fill="#F59E0B" rx="3"/>
    <circle cx="0" cy="-35" r="8" fill="#F59E0B"/>
    <!-- Balance beam -->
    <rect x="-70" y="-25" width="140" height="5" fill="#FCD34D" rx="2"/>
    <!-- Left pan (Debit) -->
    <line x1="-60" y1="-22" x2="-60" y2="10" stroke="#93C5FD" stroke-width="2"/>
    <path d="M-80,10 Q-60,25 -40,10" fill="none" stroke="#93C5FD" stroke-width="2.5"/>
    <text x="-60" y="42" text-anchor="middle" font-size="14" fill="#93C5FD" font-weight="bold" font-family="sans-serif">차변</text>
    <!-- Right pan (Credit) -->
    <line x1="60" y1="-22" x2="60" y2="10" stroke="#FCA5A5" stroke-width="2"/>
    <path d="M40,10 Q60,25 80,10" fill="none" stroke="#FCA5A5" stroke-width="2.5"/>
    <text x="60" y="42" text-anchor="middle" font-size="14" fill="#FCA5A5" font-weight="bold" font-family="sans-serif">대변</text>
  </g>
  
  <!-- 3 small icons row -->
  <g transform="translate(0, 185)">
    <!-- Calculator icon -->
    <g transform="translate(140, 0)">
      <rect x="-20" y="-25" width="40" height="50" fill="#ffffff" opacity="0.15" rx="6"/>
      <rect x="-14" y="-20" width="28" height="12" fill="#22D3EE" opacity="0.6" rx="2"/>
      <circle cx="-8" cy="2" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="2" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="8" cy="2" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="-8" cy="12" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="0" cy="12" r="3" fill="#ffffff" opacity="0.5"/>
      <circle cx="8" cy="12" r="3" fill="#F59E0B" opacity="0.7"/>
    </g>
    <!-- Coins icon -->
    <g transform="translate(300, 0)">
      <ellipse cx="-6" cy="10" rx="18" ry="8" fill="#F59E0B" opacity="0.5"/>
      <ellipse cx="-6" cy="4" rx="18" ry="8" fill="#FCD34D" opacity="0.6"/>
      <ellipse cx="6" cy="0" rx="18" ry="8" fill="#F59E0B" opacity="0.5"/>
      <ellipse cx="6" cy="-6" rx="18" ry="8" fill="#FCD34D" opacity="0.7"/>
      <text x="6" y="-2" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold" font-family="sans-serif">₩</text>
    </g>
    <!-- Chart icon -->
    <g transform="translate(460, 0)">
      <rect x="-8" y="0" width="10" height="22" fill="#34D399" opacity="0.6" rx="2"/>
      <rect x="6" y="-10" width="10" height="32" fill="#60A5FA" opacity="0.6" rx="2"/>
      <rect x="20" y="-5" width="10" height="27" fill="#A78BFA" opacity="0.6" rx="2"/>
      <line x1="-15" y1="22" x2="35" y2="22" stroke="#ffffff" opacity="0.3" stroke-width="1"/>
    </g>
  </g>

  <!-- Main Title -->
  <text x="300" y="280" text-anchor="middle" font-size="52" fill="#ffffff" font-weight="bold" font-family="sans-serif" filter="url(#shadow)">회계원리</text>
  
  <!-- Subtitle -->
  <text x="300" y="315" text-anchor="middle" font-size="18" fill="#C7D2FE" font-family="sans-serif">Accounting Principles</text>
  
  <!-- Bottom tag -->
  <rect x="210" y="340" width="180" height="32" fill="#ffffff" opacity="0.2" rx="16"/>
  <text x="300" y="361" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="bold" font-family="sans-serif">기초부터 실전까지</text>
</svg>